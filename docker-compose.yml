services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    restart: unless-stopped
    depends_on:
      provider-a:
        condition: service_started
      provider-b:
        condition: service_started
      provider-c:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${GATEWAY_PORT}/health')"
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 10s

  provider-a:
    build:
      context: .
      dockerfile: mock_providers/Dockerfile
    container_name: provider-a
    environment:
      PROVIDER_NAME: provider_a
      MIN_LATENCY: ${PROVIDER_A_MIN_LATENCY}
      MAX_LATENCY: ${PROVIDER_A_MAX_LATENCY}
      ERROR_RATE: ${PROVIDER_A_ERROR_RATE}
      RATE_LIMIT: ${PROVIDER_A_RATE_LIMIT}
    restart: unless-stopped

  provider-b:
    build:
      context: .
      dockerfile: mock_providers/Dockerfile
    container_name: provider-b
    environment:
      PROVIDER_NAME: provider_b
      MIN_LATENCY: ${PROVIDER_B_MIN_LATENCY}
      MAX_LATENCY: ${PROVIDER_B_MAX_LATENCY}
      ERROR_RATE: ${PROVIDER_B_ERROR_RATE}
      RATE_LIMIT: ${PROVIDER_B_RATE_LIMIT}
    restart: unless-stopped

  provider-c:
    build:
      context: .
      dockerfile: mock_providers/Dockerfile
    container_name: provider-c
    environment:
      PROVIDER_NAME: provider_c
      MIN_LATENCY: ${PROVIDER_C_MIN_LATENCY}
      MAX_LATENCY: ${PROVIDER_C_MAX_LATENCY}
      ERROR_RATE: ${PROVIDER_C_ERROR_RATE}
      RATE_LIMIT: ${PROVIDER_C_RATE_LIMIT}
    restart: unless-stopped

  rabbitmq:
    image: docker.arvancloud.ir/rabbitmq:3-management
    container_name: gateway-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: gateway-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: docker.arvancloud.ir/mongo:7
    container_name: gateway-mongodb
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: docker.arvancloud.ir/mongo-express:1
    container_name: gateway-mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: ${MONGODB_URL}
      ME_CONFIG_BASICAUTH: ${MONGO_EXPRESS_BASICAUTH}
    depends_on:
      mongodb:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # No container_name: allows `docker compose up --scale celery-worker=N`.
    command: >
      celery -A gateway.celery_app:celery_app worker
      --loglevel=info
      --queues=gateway.process
      --concurrency=${CELERY_CONCURRENCY}
    stop_grace_period: 30s
    deploy:
      replicas: ${CELERY_WORKERS}
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      provider-a:
        condition: service_started
      provider-b:
        condition: service_started
      provider-c:
        condition: service_started
    restart: unless-stopped


volumes:
  rabbitmq_data:
  redis_data:
  mongodb_data:
